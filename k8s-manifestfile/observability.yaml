# Observability Namespace & Monitoring Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blogverse-api-monitor
  namespace: observability
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: server
  endpoints:
    - port: http
      path: "/api/health"
      interval: 15s
