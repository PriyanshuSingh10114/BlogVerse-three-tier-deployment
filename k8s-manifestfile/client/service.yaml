apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: three-tier
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: blogverse
spec:
  type: ClusterIP
  selector:
    role: client
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
