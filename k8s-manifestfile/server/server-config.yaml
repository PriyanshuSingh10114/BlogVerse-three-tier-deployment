apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  namespace: three-tier
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: blogverse
data:
  PORT: "5000"
  NODE_ENV: "production"
  CLIENT_URL: "https://yourdomain.com"
  MONGODB_URI: "mongodb://mongodb-svc:27017/BlogVerse"
  EMAIL_USER: "notifications@yourdomain.com"
