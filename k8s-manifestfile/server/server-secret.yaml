apiVersion: v1
kind: Secret
metadata:
  name: server-secret
  namespace: three-tier
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: blogverse
type: Opaque
# Populate these secrets via AWS Secrets Manager / External Secrets Operator or SealedSecrets in production
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_JWT_SECRET_STRING_64_CHAR"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION_JWT_REFRESH_SECRET_STRING_64_CHAR"
  EMAIL_PASS: "CHANGE_ME_IN_PRODUCTION_SMTP_PASSWORD"
