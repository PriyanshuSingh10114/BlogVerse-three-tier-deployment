name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_CLIENT: public.ecr.aws/r7m1r0t0/blogverse-client-app
  ECR_REPOSITORY_SERVER: public.ecr.aws/r7m1r0t0/blogverse-server-app

jobs:
  code-quality-and-audit:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Lint Client
        run: npm run lint --prefix client

      - name: Lint Server
        run: npm run lint --prefix server

      - name: Build Client (Production Bundle Validation)
        run: npm run build --prefix client

      - name: Client Dependency Audit (Production)
        run: npm audit --prefix client --omit=dev --audit-level=critical

      - name: Server Dependency Audit (Production)
        run: npm audit --prefix server --omit=dev --audit-level=critical

  build-and-push:
    name: Build & Push Docker Images
    needs: code-quality-and-audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_CLIENT }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY_CLIENT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_SERVER }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY_SERVER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
